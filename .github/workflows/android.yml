name: Android CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout PipePipeClient
      uses: actions/checkout@v4
      with:
        path: PipePipeClient

    - name: Checkout PipePipeExtractor
      uses: actions/checkout@v4
      with:
        repository: apostol1987/PipePipeExtractor
        path: PipePipeExtractor

    - name: set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x ./PipePipeClient/gradlew

    - name: Build debug APK
      working-directory: ./PipePipeClient
      env:
        JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
      run: ./gradlew assembleDebug --no-configuration-cache --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: PipePipeClient/app/build/outputs/apk/debug/*.apk
